name: Build Android APK (EAS)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          eas whoami

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Android signing key
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'albumpass123' }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'albumkey' }}
        run: |
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | base64 -d > android-keystore.jks
          else
            keytool -genkeypair -v -storetype JKS \
              -keystore android-keystore.jks \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Wedding Album, OU=App, O=Studio, L=Addis Ababa, ST=AA, C=ET"
          fi
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "./android-keystore.jks",
                "keystorePassword": "$KS_PASS",
                "keyAlias": "$KS_ALIAS",
                "keyPassword": "$KS_PASS"
              }
            }
          }
          EOF

      - name: Build APK on EAS
        run: eas build --platform android --profile preview --non-interactive --no-wait
